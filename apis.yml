aid: nanome
name: Nanome
description: >-
  Nanome is a collaborative workspace for drug discovery — molecular visualization and design in
  VR/XR and the browser, backed by an in-session AI assistant called MARA. Scientists and agents
  load protein and small-molecule structures from public databases (RCSB PDB, AlphaFold, PubChem,
  ChEMBL, SWISS-MODEL, COD), organize them into scenes with rich visual representations
  (cartoons, surfaces, ball-and-stick, interactions), and collaborate inside shared 3D workspaces.
  Nanome exposes a REST Workspaces API (workspaces.nanome.ai) and an official Model Context
  Protocol (MCP) server so agents can build and populate workspaces programmatically, plus a Python
  library (nanome-lib) for authoring plugins. Surfaced as a portfolio company of Bullpen Capital and
  enriched into the API Evangelist network.
